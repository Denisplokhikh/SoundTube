[package]
name = "melodown"
version = "0.1.0"
description = "melodown desktop shell"
authors = ["melodown contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "melodown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
