<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!--
    SoundTube — иконка приложения (исходник).
    Мотив: живой эквалайзер (четыре полосы разной высоты) на терминальной плите.
    Палитра взята из web/styles.css: акцент #9dbf7f, фон #0b0c0b, линия #242824.
    Пересобрать набор иконок: npx tauri icon src-tauri/app-icon.svg
  -->
  <defs>
    <linearGradient id="plate" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141814"/>
      <stop offset="0.55" stop-color="#0c0e0c"/>
      <stop offset="1" stop-color="#070807"/>
    </linearGradient>
    <linearGradient id="ink" x1="300" y1="280" x2="720" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cbe7ad"/>
      <stop offset="0.45" stop-color="#9dbf7f"/>
      <stop offset="1" stop-color="#6b9054"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(512 505) scale(360)">
      <stop offset="0" stop-color="#9dbf7f" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#9dbf7f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- плита -->
  <rect width="1024" height="1024" rx="228" fill="url(#plate)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="219" stroke="#2c322c" stroke-width="8"/>
  <rect width="1024" height="1024" rx="228" fill="url(#halo)"/>

  <!-- эквалайзер -->
  <g fill="url(#ink)" transform="translate(512 512) scale(1.1) translate(-512 -512)">
    <rect x="292" y="414" width="86" height="196" rx="43"/>
    <rect x="410" y="330" width="86" height="364" rx="43"/>
    <rect x="528" y="376" width="86" height="272" rx="43"/>
    <rect x="646" y="274" width="86" height="476" rx="43"/>
  </g>
</svg>
