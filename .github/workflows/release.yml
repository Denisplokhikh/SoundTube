name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Тег — источник правды для релиза: даже если версию в файлах забыли поднять,
      # установщик и /api/update получат номер из тега.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync version from tag
        run: python scripts/version.py "${{ github.ref_name }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Системные зависимости для Linux (Tauri v2)
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install frontend dependencies
        run: npm install

      - name: Build sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-sidecar.ps1

      - name: Build sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/build-sidecar.sh

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SoundTube ${{ github.ref_name }}'
          releaseBody: 'Скачайте установщик для вашей платформы.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    # Только после десктопа: релиз для тега уже создан tauri-action, APK лишь докладываем в него.
    # Иначе две джобы наперегонки создавали бы один и тот же релиз.
    needs: build
    runs-on: ubuntu-latest
    # Ключ подписи лежит в секретах окружения android-env, поэтому джоба обязана его объявить.
    # Секреты уровня репозитория сюда не подмешиваются — источник подписи один.
    environment: android-env
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync version from tag
        run: python scripts/version.py "${{ github.ref_name }}"

      # Android SDK 35 предустановлен на ubuntu-latest, ставить его не нужно.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Keystore не коммитится: в secrets хранится base64, на раннере разворачиваем его
      # во временный файл и отдаём Gradle через ANDROID_KEYSTORE_PATH.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет ANDROID_KEYSTORE_BASE64 не задан"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "SoundTube-${{ github.ref_name }}-android.apk"
          gh release upload "${{ github.ref_name }}" \
            "SoundTube-${{ github.ref_name }}-android.apk" --clobber
