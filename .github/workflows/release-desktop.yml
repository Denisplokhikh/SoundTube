name: Release desktop

# Тег vX.Y.Z — релиз десктопа (Windows + Linux). Android выпускается
# отдельным тегом android-vX.Y.Z, см. release-android.yml.
on:
  push:
    tags:
      - 'v*'

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "SoundTube $RELEASE_TAG" \
              --notes 'Лицензии и исходники встроенного FFmpeg приложены к релизу. APK для Android — в релизах с префиксом android-.'
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Attach FFmpeg sources and third-party notices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p build/release-sources
          curl --fail --location --retry 3 \
            https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/8dca1586f468bfcbb78ae3ed618af1361d9f140a \
            --output build/release-sources/ffmpeg-8dca1586f4-source.tar.gz
          curl --fail --location --retry 3 \
            https://codeload.github.com/FFmpeg-Builds/FFmpeg-Builds/tar.gz/5031c6f1082414e53688d39e521849905071070d \
            --output build/release-sources/ffmpeg-build-recipes-5031c6f.tar.gz
          gh release upload "$RELEASE_TAG" THIRD_PARTY_NOTICES.md licenses/* build/release-sources/* --clobber

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Тег — источник правды для релиза: даже если версию в файлах забыли поднять,
      # установщик и /api/update получат номер из тега.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync desktop version from tag
        run: python scripts/version.py --desktop "${{ github.ref_name }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Системные зависимости для Linux (Tauri v2). Плагины GStreamer копируются
      # в AppImage с машины сборки (bundleMediaFramework), без них нет звука.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav gstreamer1.0-pulseaudio

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install frontend dependencies
        run: npm install

      - name: Build sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-sidecar.ps1

      - name: Build sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/build-sidecar.sh

      - name: Build and upload to release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
