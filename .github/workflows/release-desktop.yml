name: Release desktop

# Тег vX.Y.Z — релиз десктопа (Windows + Linux). Android выпускается
# отдельным тегом android-vX.Y.Z, см. release-android.yml.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Тег — источник правды для релиза: даже если версию в файлах забыли поднять,
      # установщик и /api/update получат номер из тега.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync desktop version from tag
        run: python scripts/version.py --desktop "${{ github.ref_name }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Системные зависимости для Linux (Tauri v2). Плагины GStreamer копируются
      # в AppImage с машины сборки (bundleMediaFramework), без них нет звука.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav gstreamer1.0-pulseaudio

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install frontend dependencies
        run: npm install

      - name: Build sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-sidecar.ps1

      - name: Build sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/build-sidecar.sh

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SoundTube ${{ github.ref_name }}'
          releaseBody: 'Скачайте установщик для вашей платформы. APK для Android — в релизах с префиксом android-.'
          releaseDraft: false
          prerelease: false
