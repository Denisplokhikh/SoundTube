name: CI

# Десктоп: Python-тесты и согласованность версии десктопа.
# Android проверяется отдельно — .github/workflows/android-ci.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # До uv sync: он сам правит uv.lock, и разъехавшуюся версию было бы не видно.
      - name: Check desktop version consistency
        run: python3 scripts/version.py --check desktop

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q
