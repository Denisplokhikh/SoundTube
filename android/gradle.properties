# ВАЖНО: не задавайте здесь -Dfile.encoding! Gradle записывает classpath тестового
# воркера в @argfile в кодировке демона, а JDK-лаунчер читает её в системной
# кодировке Windows. При несовпадении (например, UTF-8 против windows-1251)
# кириллический путь проекта «Рабочий стол» превращается в кракозябры и ВСЕ
# unit-тесты падают с ClassNotFoundException. Без флага кодировки совпадают всегда.
org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Project path contains Cyrillic (OneDrive/desktop dir); aapt2 and javac handle it,
# so the AGP guard is disabled deliberately.
android.overridePathCheck=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

