[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melodown"
version = "0.1.0"
description = "Self-hosted music playlist archiver: YouTube Music and SoundCloud to a local library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "melodown contributors" }]
keywords = ["music", "playlist", "yt-dlp", "self-hosted", "archive"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2024.12.13",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "mutagen>=1.47",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
